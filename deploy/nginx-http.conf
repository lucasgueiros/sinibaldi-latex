# Modelo provisório (só HTTP), usado até o certificado ser emitido. Ver deploy/nginx.conf.
upstream __INSTANCE__ {
    server unix:/run/__INSTANCE__/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    client_max_body_size 10m;
    # __EXTRA_HEADERS__

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /static/ {
        alias /srv/__INSTANCE__/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_pass http://__INSTANCE__;
    }
}
