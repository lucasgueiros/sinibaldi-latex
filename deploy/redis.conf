# Modelo do Redis da instância (deploy/sinibaldi-redis.service). O bootstrap troca __INSTANCE__ e
# instala em /etc/<instância>/redis.conf. Só guarda a fila do Celery e os resultados das tarefas
# (expiram em 24 h): tudo regenerável, por isso pouca memória e persistência leve.

# só socket unix, acessível apenas ao usuário da instância
port 0
unixsocket /run/__INSTANCE__-redis/redis.sock
unixsocketperm 700
protected-mode yes

daemonize no
supervised systemd
logfile ""
loglevel notice

databases 1
maxmemory 256mb
# fila de tarefas: melhor recusar escrita do que descartar mensagens em silêncio
maxmemory-policy noeviction

# instantâneo em disco: a fila sobrevive a um reinício da VM
dir /srv/__INSTANCE__/redis
dbfilename dump.rdb
save 300 1
save 60 100
appendonly no
