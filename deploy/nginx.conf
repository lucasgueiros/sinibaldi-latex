# Modelo do nginx com HTTPS. O bootstrap (deploy/bootstrap-vm.sh) troca os marcadores (instância,
# domínio, nomes do servidor, cabeçalhos extras) e instala em /etc/nginx/sites-available/<instância>.
# Certificado: Let's Encrypt (renovação automática pelo certbot.timer).

upstream __INSTANCE__ {
    server unix:/run/__INSTANCE__/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;        # sintaxe compatível com nginx 1.18 (Ubuntu 22.04)
    listen [::]:443 ssl http2;
    server_name __SERVER_NAMES__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Endereço canônico (ex.: www → domínio principal)
    if ($host != "__DOMAIN__") { return 301 https://__DOMAIN__$request_uri; }

    client_max_body_size 10m;
    # __EXTRA_HEADERS__

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/__INSTANCE__.access.log;
    error_log  /var/log/nginx/__INSTANCE__.error.log;

    location /static/ {
        alias /srv/__INSTANCE__/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        # PDFs e LaTeX dos trechos são gerados na hora (os grandes, em segundo plano)
        proxy_read_timeout 120s;
        proxy_pass http://__INSTANCE__;
    }
}
