{# Uso: {% include "includes/page_header.html" with titulo="..." eyebrow="..." intro="..." %} #}
<section class="relative overflow-hidden border-b border-crimson/15 bg-parchment-dark/60">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_-20%,theme(colors.crimson.DEFAULT/0.10),transparent_60%)]"></div>
  <div class="relative mx-auto max-w-4xl px-4 py-12 text-center sm:px-6 sm:py-16">
    {% if eyebrow %}<p class="font-display text-xs tracking-[0.3em] text-gold-dark">{{ eyebrow }}</p>{% endif %}
    <h1 class="mt-3 font-display text-3xl font-semibold tracking-[0.06em] text-crimson sm:text-5xl">{{ titulo }}</h1>
    {% include "includes/ornament.html" %}
    {% if intro %}<p class="mx-auto mt-2 max-w-2xl text-xl italic leading-relaxed text-ink/80">{{ intro }}</p>{% endif %}
  </div>
</section>
