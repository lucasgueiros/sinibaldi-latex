{# Abas de uma edição derivada (contexto: nova = a edição). Uso: {% include "nova/_nav.html" with ativa="estrutura" %} #}
<nav class="abas mb-6" aria-label="{{ nova.titulo }}">
  <a href="{% url 'obra:painel' %}" class="aba">&larr; Painel</a>
  <a href="{% url 'obra:nova_estrutura' nova.slug %}" class="{% if ativa == 'estrutura' %}aba-ativa{% else %}aba{% endif %}">Estrutura</a>
  <a href="{% url 'obra:nova_pendencias' nova.slug %}" class="{% if ativa == 'pendencias' %}aba-ativa{% else %}aba{% endif %}">Pendências da 1916</a>
  <a href="{% url 'obra:edicao' nova.slug %}" class="aba">Ver publicada</a>
</nav>
