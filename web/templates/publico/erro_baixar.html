{% extends "base.html" %}
{% block title %}Não foi possível baixar{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl px-4 py-16 text-center sm:px-6">
  <h1 class="font-display text-2xl font-semibold tracking-[0.06em] text-crimson">Não foi possível gerar o {{ formato }}</h1>
  <p class="mt-4 text-lg">{{ erro }}</p>
  <p class="mt-6"><a class="btn btn-primario btn-sm" href="{% url 'obra:no' edicao.slug no.xml_id %}">Voltar ao trecho</a></p>
</div>
{% endblock %}
